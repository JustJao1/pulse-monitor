services:
  app:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/workspace',timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 10
